{% extends "base.html" %}

{% block title %}Internal Server Error (500) – CodeQuiz{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="display-1 fw-bold text-danger font-monospace mb-2">500</div>
            <h3 class="fw-bold text-light mb-3">Internal Server Error</h3>
            <p class="text-secondary mb-4">Something went wrong while processing your quiz request. Please try again.</p>
            <a href="{{ url_for('index') }}" class="btn btn-primary rounded-pill px-4 shadow">
                <i class="fa-solid fa-house me-1"></i> Return to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
